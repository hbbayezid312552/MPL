<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Update Password — City Premier League</title>

<link
  rel="stylesheet"
  href="../src/css/style.css"
>

</head>


<body
  style="
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    background:var(--pitch);
  "
>


<div
  class="card"
  style="
    max-width:380px;
    width:100%;
    margin:16px;
  "
>


<h2
  style="
    margin-top:0;
    text-align:center;
  "
>
  🔐 Update Password
</h2>


<p
  class="muted"
  style="
    text-align:center;
    font-size:0.85rem;
  "
>
  Create a new password for your admin account.
</p>


<form id="updatePasswordForm">


<div class="form-group">

<label>
  New Password
</label>

<input
  type="password"
  id="newPassword"
  required
  minlength="6"
  autocomplete="new-password"
  placeholder="Enter new password"
>

</div>


<div class="form-group">

<label>
  Confirm Password
</label>

<input
  type="password"
  id="confirmPassword"
  required
  minlength="6"
  autocomplete="new-password"
  placeholder="Confirm new password"
>

</div>


<button
  type="submit"
  class="btn btn-primary btn-block"
  id="updatePasswordBtn"
>
  Update Password
</button>


</form>


<p
  class="muted"
  style="
    font-size:0.78rem;
    text-align:center;
    margin-top:14px;
  "
>

<a href="login.html">
  ← Back to Login
</a>

</p>


</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script src="../src/js/config.js"></script>

<script src="../src/js/supabaseClient.js"></script>

<script src="../src/js/utils.js"></script>


<script>

const supabase = window.supabaseClient;


/* =========================
   PASSWORD RECOVERY
========================= */

let recoverySession = null;


/*
   Supabase sends PASSWORD_RECOVERY
   after the reset link is opened.
*/

supabase.auth.onAuthStateChange(
  async (event, session) => {

    console.log(
      "Auth event:",
      event
    );


    if (event === "PASSWORD_RECOVERY") {

      recoverySession = session;

      console.log(
        "Password recovery session received."
      );

    }

  }
);


/* =========================
   CHECK SESSION
========================= */

(async () => {

  const {
    data: { session }
  } = await supabase.auth.getSession();


  if (session) {

    recoverySession = session;

  }

})();


/* =========================
   UPDATE PASSWORD
========================= */

document
  .getElementById("updatePasswordForm")
  .addEventListener("submit", async (e) => {

    e.preventDefault();


    const btn =
      document.getElementById(
        "updatePasswordBtn"
      );


    const newPassword =
      document.getElementById(
        "newPassword"
      ).value;


    const confirmPassword =
      document.getElementById(
        "confirmPassword"
      ).value;


    /* Password match */

    if (newPassword !== confirmPassword) {

      toast(
        "Passwords do not match.",
        "error"
      );

      return;
    }


    /* Minimum password length */

    if (newPassword.length < 6) {

      toast(
        "Password must be at least 6 characters.",
        "error"
      );

      return;
    }


    setLoading(
      btn,
      true,
      "Updating..."
    );


    try {

      const { error } =
        await supabase.auth.updateUser({
          password: newPassword
        });


      setLoading(
        btn,
        false
      );


      if (error) {

        console.error(error);

        toast(
          error.message ||
          "Password update failed.",
          "error"
        );

        return;
      }


      toast(
        "Password updated successfully!",
        "success"
      );


      /* Wait a little then go to login */

      setTimeout(async () => {

        await supabase.auth.signOut();

        window.location.href =
          "login.html";

      }, 1500);


    } catch (err) {

      console.error(err);

      setLoading(
        btn,
        false
      );

      toast(
        "Something went wrong. Please try again.",
        "error"
      );

    }

  });

</script>

</body>
</html>
