<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Login — City Premier League</title>

  <link rel="stylesheet" href="../src/css/style.css">
</head>


<body
  style="
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    background:var(--pitch);
  "
>


  <div
    class="card"
    style="
      max-width:380px;
      width:100%;
      margin:16px;
    "
  >


    <h2 style="margin-top:0;text-align:center;">
      🏏 Admin Login
    </h2>


    <p
      class="muted"
      style="
        text-align:center;
        font-size:0.85rem;
      "
    >
      Super Admin & Match Operator access
    </p>


    <!-- LOGIN FORM -->

    <form id="loginForm">


      <!-- EMAIL -->

      <div class="form-group">

        <label for="email">
          Email
        </label>

        <input
          type="email"
          id="email"
          required
          autocomplete="username"
          placeholder="Enter your email"
        >

      </div>


      <!-- PASSWORD -->

      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input
          type="password"
          id="password"
          required
          autocomplete="current-password"
          placeholder="Enter your password"
        >

      </div>


      <!-- LOGIN BUTTON -->

      <button
        type="submit"
        class="btn btn-primary btn-block"
        id="loginBtn"
      >
        Log In
      </button>


    </form>


    <!-- FORGOT PASSWORD -->

    <div
      style="
        text-align:center;
        margin-top:16px;
      "
    >

      <button
        type="button"
        id="forgotPasswordBtn"
        style="
          background:none;
          border:none;
          padding:0;
          color:#2563eb;
          text-decoration:underline;
          cursor:pointer;
          font-size:0.9rem;
        "
      >
        Forgot Password?
      </button>

    </div>


    <!-- BACK TO WEBSITE -->

    <p
      class="muted"
      style="
        font-size:0.78rem;
        text-align:center;
        margin-top:18px;
      "
    >

      <a href="../index.html">
        ← Back to site
      </a>

    </p>


  </div>


  <!-- SUPABASE -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"
  ></script>


  <!-- YOUR CONFIG -->

  <script src="../src/js/config.js"></script>

  <script src="../src/js/supabaseClient.js"></script>

  <script src="../src/js/utils.js"></script>


  <script>


    /* =========================================
       CHECK SUPABASE
    ========================================= */

    if (!window.supabaseClient) {

      alert(
        "Supabase connection পাওয়া যায়নি।\n\n" +
        "Please check config.js and supabaseClient.js."
      );

      throw new Error(
        "Supabase client not found."
      );

    }


    const supabase =
      window.supabaseClient;



    /* =========================================
       LOGIN
    ========================================= */

    document
      .getElementById("loginForm")
      .addEventListener(
        "submit",
        async function (e) {

          e.preventDefault();


          const loginBtn =
            document.getElementById("loginBtn");


          const email =
            document
              .getElementById("email")
              .value
              .trim();


          const password =
            document
              .getElementById("password")
              .value;


          if (!email) {

            alert(
              "Please enter your email address."
            );

            return;
          }


          if (!password) {

            alert(
              "Please enter your password."
            );

            return;
          }


          loginBtn.disabled = true;

          loginBtn.textContent =
            "Logging in...";


          try {


            const { data, error } =
              await supabase.auth.signInWithPassword({

                email: email,

                password: password

              });


            console.log(
              "Login response:",
              data,
              error
            );


            if (error) {

              console.error(
                "Login error:",
                error
              );


              alert(
                "Login failed:\n\n" +
                error.message
              );


              loginBtn.disabled = false;

              loginBtn.textContent =
                "Log In";

              return;
            }


            /* LOGIN SUCCESS */

            window.location.href =
              "dashboard.html";


          } catch (err) {


            console.error(
              "Unexpected login error:",
              err
            );


            alert(
              "Something went wrong:\n\n" +
              err.message
            );


            loginBtn.disabled = false;

            loginBtn.textContent =
              "Log In";

          }

        }
      );



    /* =========================================
       FORGOT PASSWORD
    ========================================= */

    document
      .getElementById("forgotPasswordBtn")
      .addEventListener(
        "click",
        async function () {


          const emailInput =
            document.getElementById("email");


          const email =
            emailInput
              .value
              .trim();


          /* EMAIL CHECK */

          if (!email) {

            alert(
              "প্রথমে Email ঘরে আপনার Email Address লিখুন।"
            );

            emailInput.focus();

            return;
          }


          /* BUTTON */

          const forgotBtn =
            document.getElementById(
              "forgotPasswordBtn"
            );


          forgotBtn.disabled = true;

          forgotBtn.textContent =
            "Sending...";


          try {


            console.log(
              "Password reset request:",
              email
            );


            /* SEND RESET EMAIL */

            const { data, error } =
              await supabase.auth
                .resetPasswordForEmail(
                  email,
                  {

                    redirectTo:
                      "https://hbbayezid312552.github.io/MPL/admin/update-password.html"

                  }
                );


            console.log(
              "Reset response:",
              data,
              error
            );


            /* ERROR */

            if (error) {


              console.error(
                "Password reset error:",
                error
              );


              alert(
                "Password reset email পাঠানো যায়নি:\n\n" +
                error.message
              );


              return;
            }


            /* SUCCESS */

            alert(
              "Password reset email পাঠানো হয়েছে।\n\n" +
              "আপনার Email Inbox এবং Spam/Junk folder চেক করুন।"
            );


          } catch (err) {


            console.error(
              "Forgot password error:",
              err
            );


            alert(
              "একটি সমস্যা হয়েছে:\n\n" +
              err.message
            );


          } finally {


            forgotBtn.disabled = false;

            forgotBtn.textContent =
              "Forgot Password?";


          }

        }
      );



    /* =========================================
       IF ALREADY LOGGED IN
    ========================================= */

    (async function () {


      try {


        const {
          data: {
            session
          }
        } =
          await supabase.auth.getSession();


        if (session) {

          window.location.href =
            "dashboard.html";

        }


      } catch (err) {

        console.error(
          "Session check error:",
          err
        );

      }


    })();


  </script>


</body>

</html>
